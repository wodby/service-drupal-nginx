name: drupal11-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.9"
fromOptionVersionConstraint: ">=1.27"
title: Nginx (Drupal 11)

labels:
- drupal
- drupal11

build:
  link: backend
  # Only the docroot belongs in the web server image; the rest of the
  # repository stays with the linked PHP service. The same subdirectory is used
  # on both sides so both images resolve the docroot to the same absolute path.
  copySubdir: "{{settings.docroot}}"

volumes:
- name: files
  title: Files
  from: backend
  path: /mnt/files
  readOnly: true

settings:
- name: docroot
  title: Nginx docroot
  from: backend
  var: DOCROOT_SUBDIR
- name: sitedir
  title: Drupal site dir
  from: backend
  var: DRUPAL_SITE

configs:
- name: drupal11
  title: Drupal 11 preset
  filepath: /etc/gotpl/preset/drupal11.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/drupal11.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: drupal11
- name: WODBY_INIT_ACTION
  value: init
