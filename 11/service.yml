name: drupal11-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.8"
fromOptionVersionConstraint: ">=1.27"
title: Nginx (Drupal 11)

labels:
- drupal
- drupal11

build:
  link: backend
  # Only the docroot belongs in the web server image; the rest of the
  # repository is served by the linked PHP service.
  copyFrom: "${DOCROOT_SUBDIR}"
  copyTo: "${DOCROOT_SUBDIR}"

volumes:
- name: files
  title: Files
  from: backend
  path: /mnt/files
  readOnly: true

settings:
- name: docroot
  title: Nginx docroot
  from: backend
  var: DOCROOT_SUBDIR
  build: true
- name: sitedir
  title: Drupal site dir
  from: backend
  var: DRUPAL_SITE
  build: true

configs:
- name: drupal11
  title: Drupal 11 preset
  filepath: /etc/gotpl/preset/drupal11.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/drupal11.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: drupal11
- name: WODBY_INIT_ACTION
  value: init
