name: drupal10-nginx
type: service
from: php-nginx
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.12"
title: Nginx (Drupal 10)


labels:
- drupal
- drupal10

build:
  link: backend
  # Only the docroot belongs in the web server image; the rest of the
  # repository stays with the linked PHP service. The same subdirectory is used
  # on both sides so both images resolve the docroot to the same absolute path.
  copySubdir: "{{settings.docroot}}"

volumes:
- name: files
  title: Files
  from: backend
  path: /mnt/files
  readOnly: true

settings:
- name: docroot
  title: Nginx docroot
  from: backend
  var: DOCROOT_SUBDIR
- name: sitedir
  title: Drupal site dir
  from: backend
  var: DRUPAL_SITE

configs:
- name: drupal10
  title: Drupal 10 preset
  filepath: /etc/gotpl/preset/drupal10.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/drupal10.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: drupal10
- name: WODBY2_SERVICE_INIT_ACTION
  value: init
